services:
  recipevault:
    build:
      context: .

    container_name: recipevault

    restart: unless-stopped

    ports:
      - "3000:3000"

    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DATABASE_URL: file:/app/data/recipevault.db

    volumes:
      - recipevault_data:/app/data
      - recipevault_images:/app/public/generated

volumes:
  recipevault_data:
  recipevault_images: